# Redirige HTTP a HTTPS conservando la ruta solicitada.
server {
    listen 80;
    server_name localhost;

    return 301 https://$host:8443$request_uri;
}

server {
    # Servidor HTTP.
    listen 443 ssl;
    server_name localhost;

    # Certificado y clave utilizados por HTTPS.
    ssl_certificate /etc/nginx/certs/novaharvest.crt;
    ssl_certificate_key /etc/nginx/certs/novaharvest.key;

    # Limita el tamaño de las peticiones.
    client_max_body_size 64k;

    # Carpeta web y archivos de inicio.
    root /usr/share/nginx/html;
    index index.php index.html;

    # Páginas de error personalizadas.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    # Compresión de archivos.
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json;

    # Markdown como texto plano.
    location ~ \.md$ {
        types { }
        default_type text/plain;
        charset utf-8;
    }

    # Archivos estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    # Ejecución de PHP mediante PHP-FPM.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}