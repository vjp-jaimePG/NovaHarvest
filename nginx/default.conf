server {
    # Escucha HTTP dentro del contenedor.
    listen 80;
    server_name localhost;

    # Carpeta de las páginas y archivos de inicio.
    root /usr/share/nginx/html;
    index index.php index.html;

    # Páginas personalizadas para los errores.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # Solo se muestran como respuesta a un error.
    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }

    # Comprime estos tipos cuando superan 256 bytes.
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json;

    # Muestra Markdown como texto plano con tildes y eñes.
    location ~ \.md$ {
        types { }
        default_type text/plain;
        charset utf-8;
    }

    # Sirve los archivos existentes; el resto devuelve 404.
    location / {
        try_files $uri $uri/ =404;
    }
}