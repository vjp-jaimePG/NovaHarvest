services:
  # Servidor web: recibe las peticiones del navegador.
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      # Páginas y configuración disponibles solo para lectura.
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Procesador de las páginas PHP.
  php:
    build: ./php
    volumes:
      # Misma ruta de las páginas que utiliza nginx.
      - ./web:/usr/share/nginx/html:ro

      # Configuración de PHP-FPM y del intérprete.
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./php/php.ini:/usr/local/etc/php/conf.d/novaharvest.ini:ro