; Pool que ejecuta las páginas PHP.
[www]

; Usuario y grupo de los procesos trabajadores.
user = www-data
group = www-data

; Puerto interno que recibe peticiones de nginx.
listen = 9000

; Ajusta automáticamente el número de trabajadores.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3